<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AuditLab Portal Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color-scheme: dark;
  color: rgba(255, 255, 255, 0.87);
  background-color: #060b23;
  line-height: 1.5;
  font-weight: 400;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 20% 20%, rgba(0, 183, 255, 0.35), transparent 55%),
    radial-gradient(circle at 80% 30%, rgba(0, 255, 188, 0.2), transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(138, 87, 255, 0.35), transparent 60%),
    #050917;
}

#root {
  min-height: 100vh;
}

body,
button,
input,
textarea {
  font-family: inherit;
}

.app-shell {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
  min-height: 100vh;
  padding: clamp(2rem, 3vw, 3rem);
  gap: clamp(2rem, 4vw, 3.5rem);
  background: linear-gradient(135deg, rgba(5, 14, 40, 0.95), rgba(7, 22, 59, 0.8)),
    radial-gradient(circle at 20% -10%, rgba(0, 217, 255, 0.25), transparent 45%),
    radial-gradient(circle at 100% 100%, rgba(41, 196, 180, 0.2), transparent 55%),
    #050917;
}

@media (max-width: 1080px) {
  .app-shell {
    grid-template-columns: 1fr;
    padding: clamp(1.5rem, 4vw, 2rem);
  }

  .hero-panel {
    display: none;
  }
}

.hero-panel {
  position: relative;
  border-radius: 32px;
  background: rgba(5, 9, 23, 0.4);
  border: 1px solid rgba(93, 141, 255, 0.18);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: clamp(2rem, 4vw, 3.75rem);
  backdrop-filter: blur(14px);
}

.hero-copy {
  max-width: 26rem;
  z-index: 2;
}

.hero-copy h1 {
  margin: 0 0 0.75rem;
  font-weight: 600;
  font-size: clamp(2.2rem, 4vw, 2.9rem);
  letter-spacing: -0.03em;
}

.hero-copy p {
  margin: 0;
  color: rgba(209, 220, 255, 0.72);
  font-size: 1rem;
  line-height: 1.6;
}

.constellation {
  position: absolute;
  inset: 0;
}

.constellation::before {
  content: '';
  position: absolute;
  inset: 10% 12% 18% 12%;
  background: radial-gradient(circle at 15% 15%, rgba(0, 217, 255, 0.32), transparent 60%),
    radial-gradient(circle at 70% 20%, rgba(103, 60, 255, 0.35), transparent 55%),
    radial-gradient(circle at 35% 75%, rgba(27, 239, 192, 0.28), transparent 60%);
  opacity: 0.8;
  filter: blur(12px);
}

.constellation::after {
  content: '';
  position: absolute;
  inset: 0;
  background: url('data:image/svg+xml,%3Csvg width="680" height="520" xmlns="http://www.w3.org/2000/svg"%3E%3Cg stroke="rgba(120,169,255,0.22)" stroke-width="1.2" fill="none" stroke-linecap="round"%3E%3Cpath d="M90 120L190 80L290 130L380 80L480 110L570 70"/%3E%3Cpath d="M110 260L220 210L320 250L420 190L540 250L610 200"/%3E%3Cpath d="M120 360L210 420L320 360L420 430L520 360L600 410"/%3E%3C/g%3E%3C/svg%3E')
    center/cover no-repeat;
  opacity: 0.3;
}

.node {
  position: absolute;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(2, 210, 255, 0.88), rgba(122, 86, 255, 0.92));
  box-shadow: 0 12px 32px rgba(18, 33, 94, 0.45);
  opacity: 0.95;
}

.node::after {
  content: '';
  position: absolute;
  inset: 35%;
  border-radius: 50%;
  background: #050b1e;
}

@keyframes pulse {
  0%,
  100% {
    transform: scale(1) translateY(0);
    opacity: 0.95;
  }
  50% {
    transform: scale(1.08) translateY(-4px);
    opacity: 1;
  }
}

.node {
  animation: pulse 6s ease-in-out infinite;
}

.node-1 {
  top: 16%;
  left: 18%;
  animation-delay: 0.4s;
}

.node-2 {
  top: 8%;
  left: 46%;
  animation-delay: 1.2s;
}

.node-3 {
  top: 18%;
  left: 68%;
  animation-delay: 2.6s;
}

.node-4 {
  top: 32%;
  left: 28%;
  animation-delay: 3.1s;
}

.node-5 {
  top: 34%;
  left: 54%;
  animation-delay: 0.8s;
}

.node-6 {
  top: 32%;
  left: 78%;
  animation-delay: 1.7s;
}

.node-7 {
  top: 48%;
  left: 18%;
  animation-delay: 2.3s;
}

.node-8 {
  top: 54%;
  left: 46%;
  animation-delay: 1.1s;
}

.node-9 {
  top: 52%;
  left: 74%;
  animation-delay: 3.2s;
}

.node-10 {
  top: 68%;
  left: 26%;
  animation-delay: 1.6s;
}

.node-11 {
  top: 70%;
  left: 48%;
  animation-delay: 2.8s;
}

.node-12 {
  top: 72%;
  left: 70%;
  animation-delay: 0.9s;
}

.node-13 {
  top: 82%;
  left: 32%;
  animation-delay: 2.1s;
}

.node-14 {
  top: 84%;
  left: 62%;
  animation-delay: 3.4s;
}

.auth-panel {
  max-width: min(520px, 100%);
  margin-left: auto;
  margin-right: auto;
  background: rgba(4, 9, 24, 0.8);
  border-radius: 28px;
  border: 1px solid rgba(86, 131, 255, 0.25);
  box-shadow: 0 30px 60px rgba(9, 16, 38, 0.5);
  padding: clamp(2rem, 5vw, 3rem);
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
  backdrop-filter: blur(18px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.logo-text {
  font-size: 1.4rem;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.logo-mark {
  width: 42px;
  height: 42px;
}

#portal-login-title {
  margin: 0;
  font-size: clamp(1.8rem, 3vw, 2.2rem);
  font-weight: 600;
}

.tagline {
  margin: 0;
  color: rgba(202, 211, 255, 0.78);
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  font-size: 0.95rem;
  color: rgba(202, 211, 255, 0.9);
}

.field input {
  border-radius: 14px;
  border: 1px solid rgba(99, 133, 255, 0.35);
  background: rgba(7, 13, 31, 0.92);
  color: inherit;
  padding: 0.85rem 1rem;
  font-size: 1rem;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.field input::placeholder {
  color: rgba(177, 189, 238, 0.55);
}

.field input:focus {
  outline: none;
  border-color: rgba(129, 199, 255, 0.7);
  box-shadow: 0 0 0 4px rgba(84, 159, 255, 0.18);
}

.form-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.9rem;
  color: rgba(177, 189, 238, 0.75);
}

.remember {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
}

.remember input {
  width: 18px;
  height: 18px;
  border-radius: 6px;
  border: 1px solid rgba(99, 133, 255, 0.6);
  background: rgba(7, 13, 31, 0.92);
  accent-color: rgba(123, 192, 255, 0.95);
}

.link {
  color: rgba(123, 192, 255, 0.95);
  text-decoration: none;
  font-weight: 500;
}

.link:hover,
.link:focus {
  text-decoration: underline;
}

.primary-btn,
.secondary-btn {
  border: none;
  border-radius: 16px;
  padding: 0.95rem 1.2rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.primary-btn {
  background: linear-gradient(135deg, rgba(74, 141, 255, 0.95), rgba(118, 70, 255, 0.95));
  box-shadow: 0 18px 38px rgba(38, 90, 214, 0.45);
  color: white;
}

.primary-btn:hover,
.primary-btn:focus {
  transform: translateY(-1px);
  box-shadow: 0 22px 44px rgba(38, 90, 214, 0.5);
  filter: brightness(1.03);
}

.secondary-btn {
  background: rgba(12, 20, 42, 0.95);
  border: 1px solid rgba(118, 160, 255, 0.35);
  color: rgba(208, 217, 255, 0.92);
  box-shadow: 0 18px 32px rgba(7, 15, 35, 0.55);
}

.secondary-btn:hover,
.secondary-btn:focus {
  transform: translateY(-1px);
  border-color: rgba(149, 198, 255, 0.6);
  filter: brightness(1.05);
}

.divider {
  position: relative;
  text-align: center;
  color: rgba(160, 176, 220, 0.55);
  font-size: 0.9rem;
}

.divider::before,
.divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 38%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(109, 144, 211, 0.4));
}

.divider::before {
  left: 0;
}

.divider::after {
  right: 0;
  transform: scaleX(-1);
}

.secondary-btn span[role='img'] {
  font-size: 1.25rem;
}

@media (max-width: 640px) {
  .auth-panel {
    padding: clamp(1.75rem, 4vw, 2rem);
    border-radius: 22px;
  }

  .form-meta {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.75rem;
  }

  .divider::before,
  .divider::after {
    width: 30%;
  }
}

</style>
  </head>
  <body>
    <div id="root">
      <div class="app-shell">
        <div class="hero-panel" aria-hidden="true">
          <div class="constellation">
            <span class="node node-1" aria-hidden="true"></span>
            <span class="node node-2" aria-hidden="true"></span>
            <span class="node node-3" aria-hidden="true"></span>
            <span class="node node-4" aria-hidden="true"></span>
            <span class="node node-5" aria-hidden="true"></span>
            <span class="node node-6" aria-hidden="true"></span>
            <span class="node node-7" aria-hidden="true"></span>
            <span class="node node-8" aria-hidden="true"></span>
            <span class="node node-9" aria-hidden="true"></span>
            <span class="node node-10" aria-hidden="true"></span>
            <span class="node node-11" aria-hidden="true"></span>
            <span class="node node-12" aria-hidden="true"></span>
            <span class="node node-13" aria-hidden="true"></span>
            <span class="node node-14" aria-hidden="true"></span>
          </div>
          <div class="hero-copy">
            <h1>Intelligent assurance for the AI era</h1>
            <p>
              AuditLab orchestrates risk, compliance, and analytics insights so your team can make
              confident decisions faster.
            </p>
          </div>
        </div>
        <main class="auth-panel" aria-labelledby="portal-login-title">
          <div class="logo">
            <svg
              class="logo-mark"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 120 120"
              role="img"
              aria-labelledby="auditlab-logo-title"
            >
              <title id="auditlab-logo-title">AuditLab Logo</title>
              <defs>
                <linearGradient id="auditlab-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#61d5ff" />
                  <stop offset="100%" stop-color="#9a6bff" />
                </linearGradient>
              </defs>
              <circle cx="60" cy="60" r="52" fill="url(#auditlab-gradient)" opacity="0.18"></circle>
              <path
                fill="none"
                stroke="url(#auditlab-gradient)"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M30 54c0-16.569 13.431-30 30-30s30 13.431 30 30"
              ></path>
              <path
                fill="none"
                stroke="#ffffff"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M36 74c6 8 16 12 24 12s18-4 24-12"
                opacity="0.9"
              ></path>
              <circle cx="42" cy="53" r="5" fill="#ffffff"></circle>
              <circle cx="78" cy="53" r="5" fill="#ffffff"></circle>
              <path
                fill="none"
                stroke="#ffffff"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M48 36l12 18 12-18"
                opacity="0.9"
              ></path>
            </svg>
            <span class="logo-text">AuditLab</span>
          </div>
          <h2 id="portal-login-title">Welcome back</h2>
          <p class="tagline">Sign in to continue to the AuditLab intelligence workspace.</p>
          <form class="login-form">
            <label class="field" for="email">
              <span>Email</span>
              <input id="email" type="email" name="email" placeholder="you@auditlab.ai" required />
            </label>
            <label class="field" for="password">
              <span>Password</span>
              <input
                id="password"
                type="password"
                name="password"
                placeholder="••••••••"
                minlength="8"
                required
              />
            </label>
            <div class="form-meta">
              <label class="remember">
                <input type="checkbox" name="remember" />
                <span>Keep me signed in</span>
              </label>
              <a class="link" href="#forgot">
                Forgot password?
              </a>
            </div>
            <button type="submit" class="primary-btn">
              Sign in
            </button>
          </form>
          <div class="divider">
            <span>or</span>
          </div>
          <button type="button" class="secondary-btn">
            <span role="img" aria-hidden="true">
              🤖
            </span>
            Continue with Microsoft Entra ID
          </button>
        </main>
      </div>
    </div>
  </body>
</html>
