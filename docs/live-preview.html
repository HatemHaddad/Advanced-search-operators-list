    <script>
      const status = document.getElementById('status');
      const openButton = document.getElementById('open-btn');
      const downloadLink = document.getElementById('download-link');
      const inlineCode = document.getElementById('inline-url');
      const inlineAnchor = document.getElementById('inline-link');
      const { segments } = JSON.parse(document.getElementById('preview-data').textContent);
      const inlineUrl = segments.join('');
      inlineCode.textContent = inlineUrl;
      inlineAnchor.href = inlineUrl;

      async function requestPreviewUrl() {
        try {
          const response = await fetch('live-preview-url.txt', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const text = (await response.text()).trim();
          if (!text.startsWith('data:text/html')) throw new Error('Unexpected preview URL');
          return text;
        } catch (error) {
          console.warn('Falling back to inline preview URL:', error);
          return inlineUrl;
        }
      }

      async function launchPreview(replace = true) {
        const url = await requestPreviewUrl();
        if (replace) {
          window.location.replace(url);
        } else {
          window.location.href = url;
        }
      }

      launchPreview().catch(() => {
        status.textContent = 'Automatic redirect was blocked. Click “Open the login preview” instead.';
      });

      openButton.addEventListener('click', () => launchPreview(false));
      downloadLink.addEventListener('click', async (event) => {
        if (downloadLink.dataset.ready) return;
        event.preventDefault();
        const url = await requestPreviewUrl();
        const blob = new Blob([url], { type: 'text/plain' });
        downloadLink.href = URL.createObjectURL(blob);
        downloadLink.download = 'live-preview-url.txt';
        downloadLink.dataset.ready = 'true';
        downloadLink.click();
      });
    </script>
